<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Magazine</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #000;
  }

  .magazine {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }

  .page {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .page img {
    height: 100%;
    width: 100%;
    object-fit: contain;
    background: #000;
  }

  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0.7;
    animation: bounce 2s infinite;
    pointer-events: none;
  }

  @keyframes bounce {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 8px); }
  }

  .page:last-child .hint {
    display: none;
  }
</style>
</head>
<body>

<div class="magazine">
  <section class="page" id="page1">
    <img src="images/page1.png" alt="Happy Birthday page 1">
    <div class="hint">scroll down ↓</div>
  </section>
  <section class="page" id="page2">
    <img src="images/page2.png" alt="Happy Birthday page 2">
  </section>
</div>

<script>
  // Hide the scroll hint once the user reaches the last page
  const magazine = document.querySelector('.magazine');
  const hint = document.querySelector('.hint');
  magazine.addEventListener('scroll', () => {
    const atEnd = magazine.scrollTop + magazine.clientHeight >= magazine.scrollHeight - 5;
    hint.style.opacity = atEnd ? '0' : '0.7';
  });
</script>

</body>
</html>
